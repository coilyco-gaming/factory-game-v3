[tool.agentic-os.code-comments]
# The agentic-os managed block injects BEGIN/END marker comments below the
# `repos:` content line; they are machine-managed by apply-agentic-os-hooks.py
# and cannot move to a top header. Same exclusion agentic-os carries for itself.
excludes = [
    ".pre-commit-config.yaml",
]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-gaming"

[tool.agentic-os.documentation-layout]
# Large, not small. 28 docs already exceeds the small band's 20-doc cap, so
# small was never reachable without deleting eight of them, and the longest doc
# is 80 lines against the large cap of 120. A sweep stamped small fleet-wide
# during the agentic-os#1108 rollout; Kai re-picked per repo.
band = "large"
