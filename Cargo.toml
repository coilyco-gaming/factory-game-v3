[workspace]
members = [
  "crates/factory_content",
  "crates/factory_sim",
  "crates/factory_cli",
  "crates/factory_shell",
]
resolver = "2"

# Keep the interactive Bevy viewer responsive without making ordinary test
# builds pay for optimized graphics dependencies.
[profile.viewer]
inherits = "dev"
opt-level = 1

[profile.viewer.package."*"]
opt-level = 3

# Keep wasm bundles lean without slowing the dev loop.
[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
