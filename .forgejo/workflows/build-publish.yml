# Builds and publishes the factory-game-v3 image on every push to main.
# Rollout remains in coilyco-bridge/deploy.
name: build-publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Publish immutable factory-game-v3 image
        run: bash scripts/publish-image.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
        run: python3 scripts/alert-telegram.py
