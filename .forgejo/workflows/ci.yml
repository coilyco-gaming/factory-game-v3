name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    timeout-minutes: 12
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.230.0
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - run: bash scripts/test-gate.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: coilyco-flight-deck/agentic-os/actions/telegram-alert@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
