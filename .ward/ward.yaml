# Per-repo command allowlist. Add verbs here as the surface grows.

commands:
  test:
    run: bash scripts/test-gate.sh
    description: "Run the repo's pre-commit baseline with a bounded timeout."
  cargo-test:
    run: cargo test --workspace
    description: "Run the Rust workspace tests."
  cargo-run:
    run: cargo run -p factory_cli --
    description: "Run the headless Rust scenario runner."
  shell-run:
    run: cargo run -p factory_shell
    description: "Run the native Bevy simulation viewer."
  shell-build-web:
    run: bash scripts/shell-web.sh build
    description: "Build the Wasm/static viewer bundle via trunk."
  image-build:
    run: docker build -t factory-game-v3:local .
    description: "Build the deployable factory-game-v3 web image."
  check-publish:
    run: pre-commit run shellcheck --files scripts/publish-image.sh
    description: "Lint the trusted Forgejo OCI publisher shell contract."
  shell-serve:
    run: bash scripts/shell-web.sh serve
    description: "Serve the simulation viewer with trunk hot reload."

catalog:
  description: "Factory-game-v3 migration baseline. A deterministic Rust simulation with a Bevy snapshot viewer, while Unity/C# remains reference-only."
  dependsOn: []
